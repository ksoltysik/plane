# Plane — pm.int.soltysik.net
# TLS terminated here; proxied to Plane's internal Caddy (plane-proxy:80) which
# routes to web/admin/space/api/live. Deployed to /srv/nginx/sites/pm.

server {
    server_name pm.int.soltysik.net;
    listen 443 ssl;
    listen [::]:443 ssl;

    include ssl.conf;
    proxy_buffering off;
    client_max_body_size 100m;

    # Docker DNS — resolves plane-proxy on the docker_internal network.
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;
    set $plane_upstream http://plane-proxy:80;

    location / {
        proxy_pass $plane_upstream;
        proxy_redirect http:// https://;
        include proxy_params;
    }
}

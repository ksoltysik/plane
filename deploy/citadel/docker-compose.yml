# Plane CE (OIDC fork) — citadel deployment.
#
# Integration model (see deploy/citadel/README.md):
# - All Plane services run on the private `plane` network.
# - Only the Caddy `proxy` (container: plane-proxy) is additionally attached to
#   the external `docker_internal` network, where citadel's `reverse_proxy`
#   (nginx) reaches it by name and terminates TLS for pm.int.soltysik.net.
# - Plane's proxy serves plain HTTP on :80 (SITE_ADDRESS=:80, no ACME) and routes
#   internally to web/admin/space/api/live/minio.
#
# Images: api/web/admin are built locally from this fork (OIDC changes);
# space/live/proxy are unchanged from v1.3.1 and pulled from upstream.

x-app-env: &app-env
  env_file:
    - plane.env

services:
  web:
    image: plane-oidc/web:v1.3.1-oidc
    restart: unless-stopped
    networks: [plane]
    depends_on: [api, worker]

  space:
    image: makeplane/plane-space:v1.3.1
    restart: unless-stopped
    networks: [plane]
    depends_on: [api, worker, web]

  admin:
    image: plane-oidc/admin:v1.3.1-oidc
    restart: unless-stopped
    networks: [plane]
    depends_on: [api, web]

  live:
    image: makeplane/plane-live:v1.3.1
    <<: *app-env
    restart: unless-stopped
    networks: [plane]
    depends_on: [api, web]

  api:
    image: plane-oidc/api:v1.3.1-oidc
    command: ./bin/docker-entrypoint-api.sh
    <<: *app-env
    restart: unless-stopped
    volumes:
      - logs_api:/code/plane/logs
    networks: [plane]
    depends_on: [plane-db, plane-redis, plane-mq]

  worker:
    image: plane-oidc/api:v1.3.1-oidc
    command: ./bin/docker-entrypoint-worker.sh
    <<: *app-env
    restart: unless-stopped
    volumes:
      - logs_worker:/code/plane/logs
    networks: [plane]
    depends_on: [api, plane-db, plane-redis, plane-mq]

  beat-worker:
    image: plane-oidc/api:v1.3.1-oidc
    command: ./bin/docker-entrypoint-beat.sh
    <<: *app-env
    restart: unless-stopped
    volumes:
      - logs_beat-worker:/code/plane/logs
    networks: [plane]
    depends_on: [api, plane-db, plane-redis, plane-mq]

  migrator:
    image: plane-oidc/api:v1.3.1-oidc
    command: ./bin/docker-entrypoint-migrator.sh
    <<: *app-env
    restart: "no"
    volumes:
      - logs_migrator:/code/plane/logs
    networks: [plane]
    depends_on: [plane-db, plane-redis]

  plane-db:
    image: postgres:15.7-alpine
    command: postgres -c 'max_connections=1000'
    restart: unless-stopped
    env_file: [plane.env]
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [plane]

  plane-redis:
    image: valkey/valkey:7.2.11-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    networks: [plane]

  plane-mq:
    image: rabbitmq:3.13.6-management-alpine
    restart: unless-stopped
    env_file: [plane.env]
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks: [plane]

  plane-minio:
    image: minio/minio:latest
    command: server /export --console-address ":9090"
    restart: unless-stopped
    env_file: [plane.env]
    volumes:
      - uploads:/export
    networks: [plane]

  # Caddy proxy: bridges the private `plane` network to citadel's reverse_proxy
  # on `docker_internal`. No host ports — nginx fronts it for TLS.
  proxy:
    image: makeplane/plane-proxy:v1.3.1
    container_name: plane-proxy
    <<: *app-env
    restart: unless-stopped
    networks: [plane, docker_internal]
    depends_on: [web, api, space, admin, live]
    volumes:
      - proxy_config:/config
      - proxy_data:/data

networks:
  plane:
  docker_internal:
    external: true

volumes:
  pgdata:
  redisdata:
  uploads:
  rabbitmq_data:
  logs_api:
  logs_worker:
  logs_beat-worker:
  logs_migrator:
  proxy_config:
  proxy_data:
